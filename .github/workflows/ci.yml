name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Gate logic, parsing and Chain splitting run anywhere: Jev and the OS are stubbed out.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install "typesafe-sdk>=0.7" pytest ruff
      - run: ruff check .
      - run: pytest -q

  macos-install:
    # The real install, pyobjc included, and the console command it provides.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: brew install portaudio
      - run: pip install .
      - run: voicecom --list
